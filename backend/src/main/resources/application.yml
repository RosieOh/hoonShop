spring:
  application:
    name: hoonshop-api

  datasource:
    # 5433 — docker-compose가 내보내는 포트. 로컬에 이미 PostgreSQL이 있어도 충돌하지 않습니다.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/hoonshop}
    username: ${DB_USERNAME:hoonshop}
    password: ${DB_PASSWORD:hoonshop}
    hikari:
      maximum-pool-size: 10
      # 재고 차감은 비관적 락을 잡습니다. 무한정 기다리면 커넥션이 고갈되므로 상한을 둡니다.
      connection-timeout: 3000

  jpa:
    open-in-view: false          # 뷰 렌더링 중 지연 로딩으로 쿼리가 새는 것을 막습니다
    hibernate:
      ddl-auto: validate         # 스키마의 주인은 Flyway입니다. Hibernate는 검증만 합니다.
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 30
        order_inserts: true
        default_batch_fetch_size: 100   # 컬렉션 N+1 완화

  flyway:
    enabled: true
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false   # ISO-8601 문자열로 (프론트가 Date로 파싱)

hoonshop:
  payment:
    # mock | toss — 기본은 목. 실연동 시 toss로 바꾸고 아래 키를 채웁니다.
    provider: ${PAYMENT_PROVIDER:mock}
    # 승인 요청 후 이 시간이 지나도 결과가 미확정이면 대사 대상이 됩니다.
    reconcile-after: PT5M
    reconcile-interval-ms: 300000
    toss:
      secret-key: ${TOSS_SECRET_KEY:}
      webhook-secret: ${TOSS_WEBHOOK_SECRET:}
      timeout: PT10S

  oauth:
    # 개발 기본값은 목입니다. 실연동 시 false로 바꾸세요.
    mock: ${OAUTH_MOCK:true}
    #
    # client-id를 여기에 빈 문자열로 두면 안 됩니다.
    # @ConditionalOnProperty는 "값이 비어 있음"과 "설정 안 됨"을 구분하지 않아서,
    # 빈 문자열이라도 실제 어댑터가 등록되고 목 대신 그쪽으로 요청이 나갑니다.
    # 그래서 아래는 주석으로 두고, 쓸 때만 환경변수로 주입합니다.
    #
    #   KAKAO_CLIENT_ID / KAKAO_CLIENT_SECRET
    #   NAVER_CLIENT_ID / NAVER_CLIENT_SECRET
    #   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET
    #
    # kakao:
    #   client-id: ${KAKAO_CLIENT_ID}
    #   client-secret: ${KAKAO_CLIENT_SECRET}

  jwt:
    # 운영에서는 반드시 환경변수로 주입하세요. 이 기본값은 로컬 개발 전용입니다.
    secret: ${JWT_SECRET:hoonshop-local-development-secret-key-change-me-please}
    access-ttl: PT1H
    refresh-ttl: P14D
  cors:
    # 와일드카드를 쓰지 않습니다 — 허용할 주소를 명시합니다.
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,https://rosieoh.github.io}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.hoonshop: DEBUG
    org.hibernate.orm.jdbc.bind: ${SQL_BIND_LOG:INFO}

server:
  port: ${PORT:8080}
  error:
    include-message: never       # 예외 메시지는 GlobalExceptionHandler가 통제합니다
